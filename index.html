<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Artsy Exchange</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<header>
  <h1>🎨 Artsy Exchange</h1>
  <div id="userBar" class="hidden">
    <span id="userName"></span>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<div id="loginView">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>

<div id="usernameView" class="hidden">
  <input id="usernameInput" placeholder="Username">
  <button onclick="saveUsername()">Continue</button>
</div>

<div id="feedView" class="hidden">
  <input id="title" placeholder="Title">
  <textarea id="content" placeholder="Write..."></textarea>
  <input type="file" id="imageInput">
  <button onclick="post()">Post</button>

  <div id="posts"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="script.js"></script>
</body>
</html>
